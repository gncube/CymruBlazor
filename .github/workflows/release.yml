name: Release

# Triggered by pushing a tag shaped like v0.1.0-preview.1, v1.2.3, etc.
# MinVer (configured in Directory.Build.props with MinVerTagPrefix "v")
# derives the NuGet package version directly from this tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool

      - name: Restore
        run: dotnet restore CymruBlazor.slnx

      - name: Build
        run: dotnet build CymruBlazor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CymruBlazor.slnx -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/CymruBlazor/CymruBlazor.csproj -c Release
          --no-build
          -o ./artifacts

      - name: Verify exactly one package was produced
        run: |
          count=$(find ./artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
          echo "Found $count .nupkg file(s)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 .nupkg in ./artifacts, found $count. Check IsPackable settings across the solution."
            exit 1
          fi

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbol package
        run: >
          dotnet nuget push "./artifacts/*.snupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Pre-release tags (e.g. v0.1.0-preview.1) are flagged as such
          # automatically on GitHub.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
