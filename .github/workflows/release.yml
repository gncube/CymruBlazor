name: Release

# Triggered by pushing a Git tag shaped like:
#
#   v0.1.0-preview.1
#   v1.2.3
#   v2.0.0-rc.1
#
# MinVer derives the NuGet/package/assembly version directly from
# the Git tag. The Git tag is the single source of truth for versioning,
# and it versions CymruBlazor, CymruBlazor.Testing and
# CymruBlazor.Testing.Axe together.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test, Pack and Publish
    runs-on: ubuntu-latest

    # This environment should be configured in GitHub and referenced
    # by the NuGet Trusted Publishing policy.
    environment:
      name: release

    steps:
      # ------------------------------------------------------------------
      # Source
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required so MinVer can see the complete tag/history information.
          fetch-depth: 0

      # ------------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ------------------------------------------------------------------
      # Restore / Build / Test
      # ------------------------------------------------------------------

      - name: Restore
        # Use NuGet.CI.Config, not the repo's default nuget.config: the
        # default config points a local feed at ./artifacts, which only
        # exists after Pack runs below. Restoring against it here (before
        # Pack) fails with NU1301 for every project in the solution.
        run: >
          dotnet restore CymruBlazor.slnx
          --configfile NuGet.CI.Config

      - name: Build
        run: dotnet build CymruBlazor.slnx -c Release --no-restore

      - name: Install Playwright browsers
        # See the matching step in ci.yml - AxeTestBase needs a real
        # Chromium binary on the runner before `dotnet test` runs.
        run: >
          pwsh tests/CymruBlazor.AccessibilityTests/bin/Release/net10.0/playwright.ps1
          install --with-deps chromium

      - name: Publish demo for the smoke run
        # DemoSmokeTests (CymruBlazor.AccessibilityTests) drives every demo
        # route in real Chromium against this published output. It FAILS
        # (rather than skips) when CYMRU_DEMO_DIR is missing under CI, so
        # this step must stay in sync with the matching step in ci.yml.
        run: >
          dotnet publish src/CymruBlazor.Demo/CymruBlazor.Demo.csproj
          -c Release
          --no-restore
          -o ./demo-smoke

      - name: Test
        env:
          CYMRU_DEMO_DIR: ${{ github.workspace }}/demo-smoke/wwwroot
          # Full smoke findings land in TestResults (uploaded below) and the job summary.
          CYMRU_SMOKE_REPORT_DIR: ${{ github.workspace }}/TestResults
        run: >
          dotnet test CymruBlazor.slnx -c Release --no-build
          --logger "trx"
          --results-directory ./TestResults

      - name: Upload test results
        # Always upload, so the demo smoke report is available even when
        # the test step fails and the release is aborted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14

      # ------------------------------------------------------------------
      # Package
      # ------------------------------------------------------------------

      - name: Pack
        # CymruBlazor, CymruBlazor.Testing and CymruBlazor.Testing.Axe are released together, at the version
        # MinVer derives from this tag. Each is a separate package so a consumer that only wants the bUnit
        # helpers does not take Playwright.
        run: |
          dotnet pack src/CymruBlazor/CymruBlazor.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/CymruBlazor.Testing/CymruBlazor.Testing.csproj -c Release --no-build -o ./artifacts
          dotnet pack src/CymruBlazor.Testing.Axe/CymruBlazor.Testing.Axe.csproj -c Release --no-build -o ./artifacts

      # ------------------------------------------------------------------
      # Validate generated packages
      #
      # The Git tag is:
      #
      #   v1.2.3
      #
      # Each package must therefore be:
      #
      #   CymruBlazor.1.2.3.nupkg
      #   CymruBlazor.Testing.1.2.3.nupkg
      #   CymruBlazor.Testing.Axe.1.2.3.nupkg
      #
      # (and the matching .snupkg files), the two testing packages must depend on exactly that version of the
      # package below them, and the files they rely on must be inside them. This protects the release pipeline
      # from publishing packages whose MinVer-derived version does not match the tag, or that disagree with
      # each other. See scripts/verify-packages.sh.
      # ------------------------------------------------------------------

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          expected_version="${tag#v}"

          echo "Git tag:          ${tag}"
          echo "Expected version: ${expected_version}"

          bash scripts/verify-packages.sh ./artifacts "${expected_version}"

          echo "Generated packages:"
          find ./artifacts \
            -maxdepth 1 \
            -type f \
            \( -name '*.nupkg' -o -name '*.snupkg' \) \
            -print

      # ------------------------------------------------------------------
      # Documentation / debug artefacts
      #
      # XML documentation is generated by GenerateDocumentationFile.
      #
      # PDB/source information is already represented through:
      #
      #   - IncludeSymbols
      #   - SymbolPackageFormat=snupkg
      #   - SourceLink
      #   - EmbedUntrackedSources
      #
      # We attach the XML documentation and the PDB of each package as additional GitHub Release artefacts for
      # consumers who want them without extracting the packages.
      # ------------------------------------------------------------------

      - name: Collect release artefacts
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          for id in CymruBlazor CymruBlazor.Testing CymruBlazor.Testing.Axe; do
            package_name="${id}.${version}"
            xml="src/${id}/bin/Release/net10.0/${id}.xml"
            pdb="src/${id}/bin/Release/net10.0/${id}.pdb"

            if [ -f "$xml" ]; then
              cp "$xml" "./artifacts/${package_name}.xml"
              echo "Added XML documentation for ${id}."
            else
              echo "::warning::XML documentation was not found at ${xml}."
            fi

            if [ -f "$pdb" ]; then
              cp "$pdb" "./artifacts/${package_name}.pdb"
              echo "Added PDB symbols for ${id}."
            else
              echo "::warning::PDB was not found at ${pdb}."
            fi
          done

          echo "Release artefacts:"
          find ./artifacts \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ------------------------------------------------------------------
      # NuGet Trusted Publishing
      #
      # This uses GitHub OIDC to obtain a short-lived NuGet credential.
      # No long-lived NuGet API key is stored in GitHub.
      # ------------------------------------------------------------------

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # ------------------------------------------------------------------
      # NuGet publication
      # ------------------------------------------------------------------

      - name: Push NuGet package
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbol package
        run: >
          dotnet nuget push "./artifacts/*.snupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ------------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/*.xml
            ./artifacts/*.pdb
