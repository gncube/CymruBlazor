name: Publish Demo

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Workflow Run ID
        id: run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "Fetching latest successful CI run ID..."
            latest_id=$(gh run list \
              --workflow "ci.yml" \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')

            if [ -z "$latest_id" ] || [ "$latest_id" = "null" ]; then
              echo "::error::Could not find a successful CI run on main to download the artifact from."
              exit 1
            fi

            echo "id=${latest_id}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts
          run-id: ${{ steps.run-id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify local package
        shell: bash
        run: |
          test -d ./artifacts
          find ./artifacts -maxdepth 1 -type f -print

      - name: Restore Demo
        run: dotnet restore src/CymruBlazor.Demo/CymruBlazor.Demo.csproj

      - name: Publish Demo
        run: dotnet publish src/CymruBlazor.Demo/CymruBlazor.Demo.csproj \
          -c Release \
          -o ./demo-publish \
          --no-restore

      - name: Rewrite base href for GitHub Pages project site
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' \
            ./demo-publish/wwwroot/index.html

      - name: Add SPA fallback + disable Jekyll processing
        run: |
          cp ./demo-publish/wwwroot/index.html ./demo-publish/wwwroot/404.html
          touch ./demo-publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo-publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
