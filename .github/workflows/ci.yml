name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer needs full tag history to compute the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore CymruBlazor source
        run: >
          dotnet restore src/CymruBlazor/CymruBlazor.csproj
          --configfile NuGet.CI.Config

      - name: Build CymruBlazor source
        run: >
          dotnet build src/CymruBlazor/CymruBlazor.csproj
          -c Release
          --no-restore

      - name: Pack CymruBlazor
        run: >
          dotnet pack src/CymruBlazor/CymruBlazor.csproj
          -c Release
          --no-build
          -o ./artifacts

      - name: Restore solution
        # Use NuGet.CI.Config here too: the repo's default nuget.config
        # points a local feed at ./artifacts, which this workflow happens
        # to create earlier (via Pack) - but that ordering is fragile.
        # Restoring against NuGet.CI.Config removes the dependency
        # entirely and matches what release.yml now does.
        run: >
          dotnet restore CymruBlazor.slnx
          --configfile NuGet.CI.Config

      - name: Build
        run: dotnet build CymruBlazor.slnx -c Release --no-restore

      - name: Install Playwright browsers
        # AxeTestBase (CymruBlazor.AccessibilityTests) launches a real
        # Chromium instance to run axe-core scans. The playwright.ps1
        # script is generated into the test project's build output during
        # `dotnet build` above, and its version always matches the
        # Microsoft.Playwright package version referenced by the project,
        # so it must run after Build and before Test.
        run: >
          pwsh tests/CymruBlazor.AccessibilityTests/bin/Release/net10.0/playwright.ps1
          install --with-deps chromium

      - name: Publish demo for the smoke run
        # DemoSmokeTests (CymruBlazor.AccessibilityTests) drives every demo
        # route in real Chromium against this published output: no console
        # errors, and axe-clean in light, dark and high-contrast. It fails
        # (rather than skips) when CYMRU_DEMO_DIR is missing under CI.
        run: >
          dotnet publish src/CymruBlazor.Demo/CymruBlazor.Demo.csproj
          -c Release
          --no-restore
          -o ./demo-smoke

      - name: Test
        env:
          CYMRU_DEMO_DIR: ${{ github.workspace }}/demo-smoke/wwwroot
          # Full smoke findings land in TestResults (uploaded below) and the job summary.
          CYMRU_SMOKE_REPORT_DIR: ${{ github.workspace }}/TestResults
        run: >
          dotnet test CymruBlazor.slnx -c Release --no-build
          --logger "trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.*nupkg
          retention-days: 14
