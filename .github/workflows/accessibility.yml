name: Accessibility CI Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  demo-smoke:
    name: Playwright Demo Smoke & Accessibility Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Artifacts Directory
        run: mkdir -p .artifacts/accessibility

      - name: Resolve Playwright version
        id: playwright
        # Single source of truth: the Microsoft.Playwright package version.
        # The Docker image must match it exactly (see docker/playwright/Dockerfile).
        run: |
          version=$(grep -oP 'Include="Microsoft\.Playwright"\s+Version="\K[^"]+' Directory.Packages.props)
          test -n "$version" || { echo "Microsoft.Playwright version not found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Playwright Docker Image
        run: |
          docker build \
            --build-arg PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }} \
            -t cymrublazor-playwright:${{ steps.playwright.outputs.version }} \
            -f docker/playwright/Dockerfile .

      - name: Run Accessibility Smoke Tests in Container
        run: |
          docker run --rm \
            --init \
            --ipc=host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e GITHUB_STEP_SUMMARY=/workspace/.github-step-summary.md \
            cymrublazor-playwright:${{ steps.playwright.outputs.version }} \
            -File ./scripts/Run-AccessibilityTests.Container.ps1

      - name: Append to GitHub Step Summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/.github-step-summary.md" ]; then
            cat "$GITHUB_WORKSPACE/.github-step-summary.md" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$GITHUB_WORKSPACE/.github-step-summary.md"
          fi

      - name: Upload Accessibility Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-report
          path: .artifacts/accessibility/demo-smoke-report.md
          if-no-files-found: warn
